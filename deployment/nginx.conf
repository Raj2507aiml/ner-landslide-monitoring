# ==============================================================================
# NER Landslide Monitoring System - Production Nginx Gateway Configuration
# Features:
#  - Rate limiting (Anti-DDoS / Anti-Scraping)
#  - Hidden Backend (Port 8000 is loopback only, never exposed to public)
#  - Static Single Page App (SPA) fallback
#  - Security headers & hidden server signatures
# ==============================================================================

# Rate limit zone: 15 requests per second per IP with a 10MB memory zone
limit_req_zone $binary_remote_addr zone=ner_api_limit:10m rate=15r/s;

# Optional: HTTP to HTTPS automatic redirection
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # SSL Certificates (Managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (Hides Server Fingerprint & Protects Citizens)
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # 1. Serve Built Frontend Static Files
    root /var/www/ner-landslide-monitoring/frontend/dist;
    index index.html;

    # Frontend Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. Reverse Proxy for API Routes (Shielded Backend)
    # The public internet calls https://YOUR_DOMAIN.COM/api/...
    # Nginx forwards it internally to http://127.0.0.1:8000/api/...
    location /api/ {
        # Enforce rate limiting with burst allowance
        limit_req zone=ner_api_limit burst=25 nodelay;

        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # WebSocket & connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass real client IP and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy GIS & Satellite raster calculations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
    }

    # 3. Secure Media Uploads Directory (Field Report Photos)
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Block Direct Access to Sensitive & Hidden Files (.env, .db, .git)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite|sqlite3|db|env|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
